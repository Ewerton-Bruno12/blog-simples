spring:
  application:
    name: blog-simples
  datasource:
    url: jdbc:mysql://localhost:3306/blog?createDatabaseIfNotExist=True
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true